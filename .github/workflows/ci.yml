# Continuous integration: every pull request and every push to main runs the
# whole proof. Nothing here needs a secret; JWT_SECRET and the database URLs
# are throwaway test values. The deploy workflow (deploy.yml) waits for this
# one to succeed on main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + Postgres integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tag beyond v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Unit tests (SQLite)
        run: uv run pytest -q
      - name: Integration tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://kanban:kanban@localhost:5432/kanban
        run: uv run pytest -q tests/integration
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://kanban:kanban@localhost:5432/kanban
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    name: Frontend (lint, typecheck, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: false
          tags: mini-kanban-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  e2e:
    name: End-to-end (Compose stack + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v
