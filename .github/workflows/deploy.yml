# Continuous delivery to Vercel (free Hobby plan), via scripts/deploy-vercel.sh.
#
#   dev   — automatic: when CI has succeeded on main, deploys that exact commit
#           to the mini-kanban-api-dev / mini-kanban-web-dev projects and
#           smoke-tests them (the script ends with scripts/smoke.sh).
#   prod  — manual: "Run workflow" with environment=production, behind the
#           `production` GitHub environment (add required reviewers there for
#           an approval gate). `ref` deploys any commit sha instead of the
#           latest main — that is also the rollback.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN, DEPLOY_DATABASE_URL, DEPLOY_DATABASE_URL_DEV (optional,
#   falls back to DEPLOY_DATABASE_URL), OPENAI_API_KEY (optional)
#
# Until VERCEL_TOKEN exists the jobs log "skipped" and exit green.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        default: production
      ref:
        description: Commit sha to deploy (empty = latest main). Use a known-good sha to roll back.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev (automatic after green CI)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://mini-kanban-web-dev.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_DATABASE_URL_DEV: ${{ secrets.DEPLOY_DATABASE_URL_DEV }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.ref != '' && inputs.ref || github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy and smoke-test dev
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not set — skipping the dev deploy (see docs/deployment.md)."
            exit 0
          fi
          scripts/deploy-vercel.sh dev

  deploy-prod:
    name: Deploy to production (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mini-kanban-web.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SHA: ${{ inputs.ref != '' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "$SHA" --json conclusion -q '.[0].conclusion // "none"')
          echo "CI for $SHA: $conclusion"
          [ "$conclusion" = "success" ] || { echo "::error::Refusing to deploy a commit without a green CI run"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy and smoke-test production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not set — skipping the production deploy (see docs/deployment.md)."
            exit 0
          fi
          scripts/deploy-vercel.sh prod
