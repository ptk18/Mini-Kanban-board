# The whole system: Postgres, the FastAPI backend and the Next.js frontend.
#
#   cp .env.example .env     # optional: every variable has a local-only default
#   docker compose up --build
#
# Frontend  http://localhost:3000     Backend  http://localhost:8000  (/docs for the API)
#
# Values come from .env when present (Compose reads it automatically) and fall
# back to the defaults after `:-`. Those defaults are for a laptop only; see
# docs/deployment.md for real environments.

name: mini-kanban

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # 5433 on the host so a Postgres installed locally (usually on 5432) is not shadowed.
      - "${POSTGRES_PORT:-5433}:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@db:5432/${POSTGRES_DB:-kanban}
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-me-for-anything-public}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle: the address the *browser* uses to
        # reach the backend, not the Compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
