# Alertmanager: every alert goes to the on-call responder's webhook
# (oncall/server.py, started on the host with `make oncall`; the Compose
# network reaches the host as host.docker.internal). When the server is not
# running, deliveries fail harmlessly and the alert is still visible in
# Alertmanager and Grafana.

route:
  receiver: oncall
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: oncall
    webhook_configs:
      - url: http://host.docker.internal:9000/alert
        send_resolved: true
