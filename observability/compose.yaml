# Observability stack, layered on top of the app stack:
#
#   docker compose -f docker-compose.yml -f observability/compose.yaml up -d --build --wait
#   # or: make observe
#
# The backend sends OTLP (traces, metrics, logs) to the Collector, which
# fans out to Tempo, Prometheus and Loki; Grafana is pre-provisioned with the
# three datasources and the Mini Kanban dashboard. The Collector also probes
# the backend's /health (http_check receiver) so availability is a metric.
#
#   Grafana      http://localhost:3001   (anonymous admin, local only)
#   Prometheus   http://localhost:9090
#   Alertmanager http://localhost:9093   (rules in alerts.yaml, see docs/alerting.md)
#
# Paths are relative to the repository root because this file is always
# combined with ../docker-compose.yml.

services:
  backend:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: mini-kanban-api
      APP_ENV: ${APP_ENV:-local}
      # Demo-only: registers POST /debug/fault so `make demo-alert` can make
      # card moves fail. This overlay is the local stack; render.yaml never sets it.
      FAULT_INJECTION: ${FAULT_INJECTION:-1}
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP in (from the backend, and from a laptop)
      - "8889:8889"   # Prometheus scrape endpoint out
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop provides it anyway
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      # Directory, not file: a rewritten file would keep its old inode inside the container.
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
