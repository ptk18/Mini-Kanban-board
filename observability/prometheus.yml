global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Everything the app emits arrives through the Collector's Prometheus
  # exporter: request metrics, card moves and the /health probe.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
