# Single-binary Tempo with local storage (derived from Tempo's
# example/docker-compose/single-binary/tempo.yaml at 3.1.x). Spans arrive
# from the Collector over OTLP/HTTP on 4318. Retention is Tempo's default
# (14 days); the volume is local only.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
