# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Everything here is on Render's free plans, so applying the Blueprint asks
# for no payment method: two free web services and the workspace's one free
# Postgres. (A production environment would need a second, paid database;
# see docs/deployment.md for how to add one later, and for a free database
# that does not expire.)
#
# Deploys are NOT triggered by pushes (autoDeployTrigger: off): GitHub
# Actions (.github/workflows/deploy.yml) calls each service's deploy hook
# after CI is green — dev automatically, prod by hand. Rollback = the same
# hook with `ref=<known-good sha>`, or "Rollback" on the Deploys page.
#
# Service names become URLs (<name>.onrender.com); if a name is taken Render
# appends a suffix, and the two URL env vars below must then be edited.

services:
  # ---------------------------------------------------------------- dev ----
  - type: web
    name: mini-kanban-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-kanban-db-dev
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mini-kanban-web-dev.onrender.com
      - key: OPENAI_API_KEY
        sync: false          # paste at Blueprint apply, or leave empty for no AI
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PORT
        value: "8000"

  - type: web
    name: mini-kanban-web-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      # Render passes env vars to the Docker build as build args, which is
      # how this reaches the ARG in frontend/Dockerfile and the bundle.
      - key: NEXT_PUBLIC_API_URL
        value: https://mini-kanban-api-dev.onrender.com
      - key: PORT
        value: "3000"


databases:
  - name: mini-kanban-db-dev
    plan: free            # 1 GB; Render deletes free databases 30 days after creation —
                          # for something longer-lived, see "Free database that does not expire" in docs/deployment.md
    region: frankfurt
    databaseName: kanban
    user: kanban
    postgresMajorVersion: "17"
    ipAllowList: []       # only Render services may connect
