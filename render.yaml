# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Two environments from one file. `dev` is entirely on free plans; `prod`
# needs a paid Postgres because a workspace gets one free database. Delete
# the three `*-prod` resources before applying if you only want dev.
#
# Deploys are NOT triggered by pushes (autoDeployTrigger: off): GitHub
# Actions (.github/workflows/deploy.yml) calls each service's deploy hook
# after CI is green — dev automatically, prod by hand. Rollback = the same
# hook with `ref=<known-good sha>`, or "Rollback" on the Deploys page.
#
# Service names become URLs (<name>.onrender.com); if a name is taken Render
# appends a suffix, and the two URL env vars below must then be edited.

services:
  # ---------------------------------------------------------------- dev ----
  - type: web
    name: mini-kanban-api-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-kanban-db-dev
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mini-kanban-web-dev.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PORT
        value: "8000"

  - type: web
    name: mini-kanban-web-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      # Render passes env vars to the Docker build as build args, which is
      # how this reaches the ARG in frontend/Dockerfile and the bundle.
      - key: NEXT_PUBLIC_API_URL
        value: https://mini-kanban-api-dev.onrender.com
      - key: PORT
        value: "3000"

  # --------------------------------------------------------------- prod ----
  - type: web
    name: mini-kanban-api-prod
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-kanban-db-prod
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mini-kanban-web-prod.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PORT
        value: "8000"

  - type: web
    name: mini-kanban-web-prod
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mini-kanban-api-prod.onrender.com
      - key: PORT
        value: "3000"

databases:
  - name: mini-kanban-db-dev
    plan: free            # 1 GB, expires 30 days after creation (Render free tier)
    region: frankfurt
    databaseName: kanban
    user: kanban
    postgresMajorVersion: "17"
    ipAllowList: []       # only Render services may connect

  - name: mini-kanban-db-prod
    plan: 0.1c-256mb      # smallest paid plan; the workspace's one free database is dev
    region: frankfurt
    databaseName: kanban
    user: kanban
    postgresMajorVersion: "17"
    ipAllowList: []
